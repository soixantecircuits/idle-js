<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>idle-js v2 demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 16px;
      }
      #status,
      #visibility {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        margin: 8px 0;
      }
      .idle {
        background: #fff3cd;
        border-color: #ffc107;
      }
      #lastActive {
        color: #666;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>idle-js v2 example</h1>
    <p>Move the mouse, press keys, scroll or touch. Idle fires after 3s.</p>
    <div id="status">The tab is active!</div>
    <div id="visibility">Tab is visible</div>
    <div id="lastActive"></div>
    <label
      >Idle timeout (ms): <input id="timeout" type="number" value="3000" min="500" step="500"
    /></label>
    <button id="apply">Apply via set()</button>
    <button id="stop">Stop</button>
    <button id="start">Start</button>
    <script type="module" src="/examples/vanilla/main.ts"></script>
  </body>
</html>
